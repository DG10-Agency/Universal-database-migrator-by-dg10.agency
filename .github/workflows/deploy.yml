name: Build & Deploy UDM

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: shubham-dg10/${{ github.event.repository.name }}

jobs:
  build:
    name: Build amd64 Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build & Push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Staging
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -euo pipefail

            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
            echo "=== Pulling $IMAGE ==="
            docker pull "$IMAGE"
            docker tag "$IMAGE" ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            echo "=== Stopping old container ==="
            docker stop universal-db-migrator 2>/dev/null || true
            docker rm universal-db-migrator 2>/dev/null || true

            echo "=== Starting new container ==="
            docker run -d \
              --name universal-db-migrator \
              --restart unless-stopped \
              -p 3003:3000 \
              -e NODE_ENV=production \
              --network edge \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            echo "=== Waiting for startup ==="
            sleep 10

            echo "=== Health check ==="
            curl -sf http://localhost:3003/ > /dev/null && echo "✅ UDM live on port 3003" || echo "❌ UDM failed to start"
